name: Publish version release

on:
  push:
    branches:
      - version-15-hotfix
      - version-16-hotfix
    paths:
      - project_planner/__init__.py

permissions:
  contents: write

concurrency:
  group: publish-version-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          import re
          from pathlib import Path

          module = ast.parse(Path("project_planner/__init__.py").read_text())
          versions = [
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          ]
          if len(versions) != 1:
              raise SystemExit("Expected exactly one app version")
          version = versions[0]
          branch = re.fullmatch(r"version-(15|16)-hotfix", os.environ["RELEASE_BRANCH"])
          if not branch or not re.fullmatch(branch[1] + r"\.\d+\.\d+", version):
              raise SystemExit("App version must match the maintenance branch major")
          for filename in ("package.json", "frontend/package.json"):
              if json.loads(Path(filename).read_text())["version"] != version:
                  raise SystemExit(f"{filename} version differs from the app")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag=v{version}\n")
          PY

      - name: Publish GitHub release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            try {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: "tags/" + tag });
              let object = ref.object;
              while (object.type === "tag") {
                const { data: annotated } = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha });
                object = annotated.object;
              }
              if (object.type !== "commit" || object.sha !== context.sha) {
                throw new Error("Release tag already points to a different commit: " + tag);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: "refs/tags/" + tag, sha: context.sha });
            }
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              if (release.draft || release.prerelease) {
                throw new Error("Existing release is not a stable published release: " + tag);
              }
              core.info("Release already published: " + release.html_url);
            } catch (error) {
              if (error.status !== 404) throw error;
              const { data: release } = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: "Project Planner " + tag,
                draft: false,
                prerelease: false,
                generate_release_notes: true,
                make_latest: context.ref === "refs/heads/version-16-hotfix" ? "true" : "false",
              });
              core.info("Published " + release.html_url);
            }
